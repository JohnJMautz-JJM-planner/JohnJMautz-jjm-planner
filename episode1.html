<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="dark">
<title>The Halloway Inheritance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,700;1,500&family=DM+Sans:wght@400;500;700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
/* Episode 1 vertical slice. Layout: full-bleed illustrated room (SVG back layer, canvas light/particle layer, SVG front layer),
   HUD on top, sheets for close-ups and the notebook. One look per world; puzzle content is identical in every world (L10). */
:root{
  --ui-bg:#07080d;--ui-panel:rgba(16,14,20,.92);--ui-panel2:rgba(255,240,215,.06);--ui-line:rgba(255,236,200,.16);
  --ui-text:#f4ead8;--ui-muted:#b8aa93;--ui-accent:#e8b65a;--ui-ink:#1d1408;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:"DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --hand:"Caveat","Bradley Hand","Segoe Print",cursive;--type:"Special Elite","American Typewriter","Courier New",monospace;
  /* scene palette: Gaslight Manor */
  --wall:#3b2621;--wallpat:#5d3c2f;--wains:#28180f;--wood:#5b3a22;--woodL:#86592f;--woodD:#2a190d;--brass:#d4a650;--brassD:#8a6526;
  --floor:#3b2414;--rug:#5c1c1e;--rug2:#b88a3c;--curtain:#4b1318;--curtainL:#7c2229;--sky1:#050c18;--sky2:#1a2a42;--sea:#0b1828;
  --shade:#1e5b43;--glass:#9fc3d6;--paper:#efe2c4;--mantel:#6b6058;--mantelL:#91857a;--leather:#3b1d14;--leatherL:#6a3524;
  --ocean:#2d5c5c;--land:#c8b27c;--shelfback:#1a0f08;--machine:#1b1a1a;--skin:#e0bc9f;--hair:#d3cec7;--dress:#2b1a26;--canvasbg:#1c2a22;
}
body[data-world="neon"]{
  --ui-accent:#45f0dc;--ui-ink:#03201d;
  --wall:#131733;--wallpat:#1f2760;--wains:#0c0f27;--wood:#1b2049;--woodL:#2d3775;--woodD:#090b1d;--brass:#45f0dc;--brassD:#1a8c80;
  --floor:#0e1130;--rug:#381150;--rug2:#ff4fc1;--curtain:#280e45;--curtainL:#4d1c7e;--sky1:#04020c;--sky2:#2b0b42;--sea:#0a0620;
  --shade:#ff3db5;--glass:#7fe8ff;--paper:#e4eaff;--mantel:#272b52;--mantelL:#3b4180;--leather:#2a1242;--leatherL:#5a2a8a;
  --ocean:#13305e;--land:#45f0dc;--shelfback:#06071a;--machine:#101226;--skin:#cfd6ff;--hair:#ff7ad6;--dress:#121a44;--canvasbg:#0d0f2e;
}
*{box-sizing:border-box;margin:0;padding:0}
:root{color-scheme:dark}
html,body{height:100%;background:var(--ui-bg);color:var(--ui-text);font-family:var(--sans);overflow:hidden;overscroll-behavior:none}
body{position:fixed;inset:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
input{-webkit-user-select:text;user-select:text;-webkit-touch-callout:default}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none}
button:focus-visible,.hot:focus-visible{outline:2px solid var(--ui-accent);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- stage ---------- */
#stage{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;background:#000}
#stage.drag{cursor:grabbing}
#stage svg,#stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx{pointer-events:none;mix-blend-mode:screen}
#front{pointer-events:none}
.vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(0,0,0,.55) 100%)}
body[data-world="neon"] .vignette{background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(10,0,30,.6) 100%),repeating-linear-gradient(0deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
.hot{cursor:pointer;outline:none}
.hot .hit{fill:transparent;stroke:transparent;stroke-width:3;transition:fill .2s,stroke .2s}
@media (hover:hover){.hot:hover .hit{fill:rgba(255,232,180,.06);stroke:rgba(255,232,180,.45)}}
.hot:focus-visible .hit{fill:rgba(255,232,180,.06);stroke:var(--ui-accent)}

/* scene fills, themed by world */
.f-wall{fill:var(--wall)}.f-wains{fill:var(--wains)}.f-wood{fill:var(--wood)}.f-woodL{fill:var(--woodL)}.f-woodD{fill:var(--woodD)}
.f-brass{fill:var(--brass)}.f-brassD{fill:var(--brassD)}.f-floor{fill:var(--floor)}.f-rug{fill:var(--rug)}.f-rug2{fill:var(--rug2)}
.f-curtain{fill:var(--curtain)}.f-curtainL{fill:var(--curtainL)}.f-sea{fill:var(--sea)}.f-shade{fill:var(--shade)}.f-paper{fill:var(--paper)}
.f-mantel{fill:var(--mantel)}.f-mantelL{fill:var(--mantelL)}.f-leather{fill:var(--leather)}.f-ocean{fill:var(--ocean)}.f-land{fill:var(--land)}
.f-shelf{fill:var(--shelfback)}.f-machine{fill:var(--machine)}.f-skin{fill:var(--skin)}.f-hair{fill:var(--hair)}.f-dress{fill:var(--dress)}.f-cbg{fill:var(--canvasbg)}
.s-brass{stroke:var(--brass)}.s-woodD{stroke:var(--woodD)}.s-leatherL{stroke:var(--leatherL)}
.wp{fill:var(--wallpat)}
.band{fill:var(--brass);opacity:.55}
.bk.b0{fill:#5b2b25}.bk.b1{fill:#2f4a3a}.bk.b2{fill:#28394f}.bk.b3{fill:#6b4a24}.bk.b4{fill:#3d2b40}.bk.b5{fill:#704030}.bk.b6{fill:#1f3a40}.bk.b7{fill:#55502c}.bk.b8{fill:#4a1f1f}.bk.b9{fill:#2d2a26}
body[data-world="neon"] .bk.b0{fill:#3a1a5c}body[data-world="neon"] .bk.b1{fill:#0f3b5c}body[data-world="neon"] .bk.b2{fill:#24206b}body[data-world="neon"] .bk.b3{fill:#5c1550}body[data-world="neon"] .bk.b4{fill:#133a4f}body[data-world="neon"] .bk.b5{fill:#46177a}body[data-world="neon"] .bk.b6{fill:#0c4a55}body[data-world="neon"] .bk.b7{fill:#2a1450}body[data-world="neon"] .bk.b8{fill:#511244}body[data-world="neon"] .bk.b9{fill:#161a3a}
.sb-moon{fill:#24365e}.sb-key{fill:#5e1f24}.sb-raven{fill:#1f2b26}.sb-anchor{fill:#1d4650}.sb-star{fill:#432a52}
body[data-world="neon"] .sb-moon{fill:#1a2a8a}body[data-world="neon"] .sb-key{fill:#7a1452}body[data-world="neon"] .sb-raven{fill:#151838}body[data-world="neon"] .sb-anchor{fill:#0b5a6b}body[data-world="neon"] .sb-star{fill:#4b1a8a}
.emb{fill:var(--brass)}

/* ---------- HUD ---------- */
.hud{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 10px) calc(env(safe-area-inset-right) + 12px) 10px calc(env(safe-area-inset-left) + 12px);background:linear-gradient(rgba(0,0,0,.6),transparent);pointer-events:none;z-index:5}
.hud > *{pointer-events:auto}
.ep{flex:1;min-width:0;line-height:1.1;text-shadow:0 1px 6px #000}
.ep small{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ui-muted)}
.ep b{font-family:var(--serif);font-size:22px;font-weight:700}
.ibtn{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:rgba(20,16,22,.6);border:1px solid var(--ui-line);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.ibtn svg{width:22px;height:22px;stroke:var(--ui-text);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.dock{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;align-items:flex-end;gap:10px;padding:10px 12px calc(env(safe-area-inset-bottom) + 14px);background:linear-gradient(transparent,rgba(0,0,0,.65));pointer-events:none;z-index:5}
.dock > *{pointer-events:auto}
.nbbtn{display:flex;align-items:center;gap:10px;height:52px;padding:0 20px 0 16px;border-radius:26px;background:var(--ui-accent);color:var(--ui-ink);font-weight:700;font-size:16px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
.nbbtn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.badge{min-width:24px;height:24px;border-radius:12px;background:var(--ui-ink);color:var(--ui-accent);font-size:12.5px;display:grid;place-items:center;padding:0 6px}
.progress{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 74px);font-size:12px;color:var(--ui-muted);text-shadow:0 1px 4px #000;pointer-events:none;z-index:5;white-space:nowrap}
.pan{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border-radius:14px;background:rgba(20,16,22,.5);border:1px solid var(--ui-line);display:grid;place-items:center;z-index:4;transition:opacity .25s}
.pan svg{width:22px;height:22px;stroke:var(--ui-text);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.pan.l{left:calc(env(safe-area-inset-left) + 8px)}.pan.r{right:calc(env(safe-area-inset-right) + 8px)}
.pan.off{opacity:0;pointer-events:none}
.toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 70px);transform:translate(-50%,-10px);max-width:min(92vw,460px);padding:11px 16px;border-radius:14px;background:var(--ui-panel);border:1px solid var(--ui-line);font-size:14.5px;line-height:1.35;text-align:center;opacity:0;transition:opacity .3s,transform .3s;pointer-events:none;z-index:30}
.toast.on{opacity:1;transform:translate(-50%,0)}

/* ---------- sheets ---------- */
.scrim{position:absolute;inset:0;background:rgba(3,3,6,.55);z-index:10;opacity:0;transition:opacity .25s}
.scrim.on{opacity:1}
.sheet{position:absolute;z-index:11;left:50%;bottom:0;width:min(100%,720px);max-height:calc(100% - env(safe-area-inset-top) - 24px);transform:translate(-50%,104%);transition:transform .38s cubic-bezier(.2,.8,.2,1);background:var(--ui-panel);border:1px solid var(--ui-line);border-bottom:0;border-radius:22px 22px 0 0;display:flex;flex-direction:column;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 -20px 60px rgba(0,0,0,.6)}
.sheet.on{transform:translate(-50%,0)}
@media (min-width:820px) and (min-height:620px){.sheet{bottom:50%;border-radius:22px;border-bottom:1px solid var(--ui-line);transform:translate(-50%,calc(50% + 40px));opacity:0;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .25s}.sheet.on{transform:translate(-50%,50%);opacity:1}}
.sh-head{display:flex;align-items:center;gap:10px;padding:14px 14px 8px 20px}
.sh-head h2{flex:1;font-family:var(--serif);font-size:26px;font-weight:700;line-height:1.05}
.sh-head small{display:block;font-family:var(--sans);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ui-muted);font-weight:500;margin-bottom:3px}
.sh-body{overflow:auto;-webkit-overflow-scrolling:touch;padding:6px 20px calc(env(safe-area-inset-bottom) + 20px);overscroll-behavior:contain}
.art{border-radius:14px;overflow:hidden;background:#0c0a0a;border:1px solid var(--ui-line);position:relative}
.art svg{display:block;width:100%;height:auto}
.desc{font-size:16px;line-height:1.5;color:var(--ui-text);margin:14px 2px 4px}
.desc em{font-family:var(--serif);font-size:18px}
.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.btn{min-height:48px;padding:0 20px;border-radius:14px;background:var(--ui-panel2);border:1px solid var(--ui-line);font-weight:600;font-size:15.5px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--ui-accent);color:var(--ui-ink);border-color:transparent}
.btn.block{width:100%}
.noted{font-size:13px;color:var(--ui-accent);margin-top:12px;display:flex;align-items:center;gap:6px}

/* paper documents */
.paper{background:#f1e5c9;color:#2b2016;border-radius:6px;padding:22px 22px 26px;box-shadow:inset 0 0 50px rgba(120,80,30,.28),0 8px 24px rgba(0,0,0,.4);position:relative;transform:rotate(-.6deg)}
body[data-world="neon"] .paper{background:#e8ecff;color:#141838;box-shadow:inset 0 0 50px rgba(60,80,200,.2),0 0 24px rgba(69,240,220,.25)}
.paper.hand{font-family:var(--hand);font-size:24px;line-height:1.28}
.paper.hand p+p{margin-top:10px}
.paper.typed{font-family:var(--type);font-size:16px;line-height:1.7;letter-spacing:.02em}
.paper .sig{text-align:right;font-size:28px;margin-top:8px}
.strike{text-decoration:line-through;text-decoration-thickness:2px;opacity:.75}
.torn{clip-path:polygon(0 4%,8% 0,18% 3%,30% 0,44% 4%,57% 1%,70% 4%,83% 0,100% 3%,100% 96%,90% 100%,76% 96%,62% 100%,48% 97%,33% 100%,20% 96%,8% 100%,0 97%)}
.codepairs{font-family:var(--hand);font-size:clamp(30px,8.4vw,42px);letter-spacing:.04em;text-align:center;line-height:1.25;padding:10px 0;display:flex;flex-wrap:wrap;justify-content:center;column-gap:clamp(10px,3vw,20px)}
.codepairs span{display:inline-block;white-space:nowrap}

/* clock door */
.clockwrap{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:600px){.clockwrap{grid-template-columns:1fr 1fr}}
.reveal{animation:rise .6s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(18px) rotate(-3deg)}to{opacity:1;transform:none}}

/* photo flip */
.flip{perspective:1200px}
.flip .card{position:relative;transition:transform .7s cubic-bezier(.3,.7,.2,1);transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.flip.back .card{transform:rotateY(180deg)}
.flip .face{-webkit-backface-visibility:hidden;backface-visibility:hidden;border-radius:10px;overflow:hidden}
.flip .face.b{position:absolute;inset:0;transform:rotateY(180deg);background:#e9dcbf;display:grid;place-items:center;padding:20px;box-shadow:inset 0 0 40px rgba(110,80,40,.35)}
body[data-world="neon"] .flip .face.b{background:#dfe5ff}
.flip .face.b p{font-family:var(--hand);font-size:30px;color:#3a2c1c;text-align:center;line-height:1.2;transform:rotate(-3deg)}

/* shelf puzzle */
.shelfbox{background:linear-gradient(#1b110a,#2a1a0e);border-radius:14px;padding:16px 10px 0;border:1px solid var(--ui-line);position:relative}
body[data-world="neon"] .shelfbox{background:linear-gradient(#070820,#11143a)}
.spines{display:flex;justify-content:center;gap:clamp(4px,1.6vw,12px);align-items:flex-end;min-height:340px;position:relative}
.spine{width:clamp(52px,15vw,78px);border-radius:5px 5px 2px 2px;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:0;position:relative;box-shadow:inset 6px 0 10px rgba(255,255,255,.08),inset -8px 0 12px rgba(0,0,0,.45),0 4px 10px rgba(0,0,0,.5);transition:transform .25s,box-shadow .25s;touch-action:manipulation}
.spine svg{width:32px;height:32px;margin-bottom:8px}
.spine .ltr{font-family:var(--serif);font-weight:700;font-size:21px;line-height:1.08;color:var(--brass);text-shadow:0 1px 0 rgba(0,0,0,.6)}
.spine .bands{position:absolute;left:4px;right:4px;height:3px;background:var(--brass);opacity:.45}
.spine.sel{transform:translateY(-16px);box-shadow:0 0 0 3px var(--ui-accent),0 12px 22px rgba(0,0,0,.6)}
.board{height:16px;margin:0 -10px;background:linear-gradient(var(--woodL),var(--woodD));border-radius:0 0 12px 12px}
.shelfhint{font-size:14px;color:var(--ui-muted);margin-top:10px;text-align:center}

/* notebook */
.nb-entries{display:flex;flex-direction:column;gap:10px}
.nb-e{display:flex;gap:12px;padding:12px 14px;border-radius:14px;background:var(--ui-panel2);border:1px solid var(--ui-line)}
.nb-e .ic{flex:none;width:34px;height:34px;border-radius:10px;background:rgba(232,182,90,.14);display:grid;place-items:center}
.nb-e .ic svg{width:20px;height:20px;stroke:var(--ui-accent);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nb-e b{display:block;font-size:14.5px;margin-bottom:2px}
.nb-e p{font-size:14.5px;line-height:1.45;color:var(--ui-muted)}
.nb-e .hand{font-family:var(--hand);font-size:26px;color:var(--ui-text);letter-spacing:.04em}
.embrow{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.embrow i{width:34px;height:34px;border-radius:8px;background:rgba(0,0,0,.35);border:1px solid var(--ui-line);display:grid;place-items:center;font-style:normal}
.embrow i svg{width:22px;height:22px;fill:var(--brass);stroke:none}
.nb-empty{font-size:14.5px;color:var(--ui-muted);padding:10px 2px}
.theory{margin-top:18px;padding:16px;border-radius:16px;border:1px solid var(--ui-line);background:rgba(0,0,0,.25)}
.theory h3{font-family:var(--serif);font-size:22px}
.theory p{font-size:14px;color:var(--ui-muted);line-height:1.45;margin:4px 0 12px}
.theory input{width:100%;height:54px;border-radius:12px;border:1px solid var(--ui-line);background:rgba(255,255,255,.06);color:var(--ui-text);font:700 22px var(--serif);letter-spacing:.12em;text-transform:uppercase;padding:0 14px;outline:none}
.theory input:focus{border-color:var(--ui-accent)}
.saved{font-size:13.5px;color:var(--ui-accent);margin-top:10px}
.sec{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ui-muted);margin:4px 2px 10px}

/* menu */
.opt{display:flex;align-items:center;gap:12px;width:100%;padding:14px;border-radius:14px;border:1px solid var(--ui-line);background:var(--ui-panel2);text-align:left;margin-bottom:10px;min-height:56px}
.opt.sel{border-color:var(--ui-accent);box-shadow:0 0 0 2px color-mix(in srgb,var(--ui-accent) 35%,transparent)}
.opt .sw{width:44px;height:44px;border-radius:10px;flex:none}
.opt b{display:block;font-size:15.5px}.opt span{font-size:13px;color:var(--ui-muted)}
.small{font-size:13.5px;color:var(--ui-muted);line-height:1.5}

/* full screens: title, narration, end */
.screen{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;transition:opacity .8s}
.screen.fade{opacity:0;pointer-events:none}
#titleCv{position:absolute;inset:0;width:100%;height:100%}
.tcontent{position:relative;padding:0 24px calc(env(safe-area-inset-bottom) + 6vh);max-width:560px;width:100%}
.kicker{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--ui-accent)}
.tmain{font-family:var(--serif);font-weight:700;font-size:clamp(56px,15vw,104px);line-height:.9;letter-spacing:.04em;margin:10px 0 6px;text-shadow:0 4px 30px rgba(0,0,0,.8)}
.tsub{font-family:var(--serif);font-style:italic;font-size:clamp(20px,5vw,26px);color:#e9dcc3;text-shadow:0 2px 12px #000}
.tep{margin:22px 0 18px;font-size:14px;color:var(--ui-muted);letter-spacing:.06em}
.tep b{color:var(--ui-text);font-weight:700}
.tfine{font-size:12px;color:var(--ui-muted);margin-top:14px;opacity:.85}
.narr{position:absolute;inset:0;z-index:15;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.82) 70%)}
.narr .box{width:min(100%,640px);margin:0 auto;padding:0 24px calc(env(safe-area-inset-bottom) + 28px)}
.narr .who{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--ui-accent);margin-bottom:10px}
.narr p{font-family:var(--serif);font-size:clamp(22px,5.6vw,30px);line-height:1.25;min-height:4.2em;text-shadow:0 2px 10px #000}
.narr .row{display:flex;justify-content:space-between;align-items:center;margin-top:18px}
.dots{display:flex;gap:6px}.dots i{width:8px;height:8px;border-radius:4px;background:rgba(255,255,255,.25)}.dots i.on{background:var(--ui-accent);width:22px}
.end{position:absolute;inset:0;z-index:16;overflow:auto;background:radial-gradient(90% 60% at 50% 0%,rgba(232,182,90,.16),transparent 70%),#070609;display:flex;justify-content:center;padding:calc(env(safe-area-inset-top) + 28px) 20px calc(env(safe-area-inset-bottom) + 28px);opacity:0;transition:opacity .5s}
.end.on{opacity:1}
.end .inner{width:min(100%,560px)}
.end h1{font-family:var(--serif);font-size:44px;line-height:1;margin:8px 0 10px}
.end .lead{font-size:16px;line-height:1.5;color:#e7dccb}

}

  const vb=`${camX.toFixed(2)} ${camY.toFixed(2)} ${viewW.toFixed(2)} ${viewH.toFixed(2)}`;

let selBook=null;
function paintSpines(){
  const box=$("#spines");if(!box)return;
  const before={};box.querySelectorAll(".spine").forEach(el=>before[el.dataset.k]=el.getBoundingClientRect().left);
  box.innerHTML=st().order.map(k=>`<button class="spine sb-${k}" data-k="${k}" aria-label="${EMBNAME[k]} book: ${BOOKS[k].split("").join(" ")}">
    <span class="bands" style="top:6px"></span>${embSvg(k)}${BOOKS[k].split("").map(l=>`<span class="ltr">${l}</span>`).join("")}<span class="bands" style="bottom:5px"></span></button>`).join("");
  box.querySelectorAll(".spine").forEach(el=>{
    const k=el.dataset.k;
    el.style.background=bookColour(k);
    if(before[k]!=null){const dx=before[k]-el.getBoundingClientRect().left;if(dx){el.style.transition="none";el.style.transform=`translateX(${dx}px)`;requestAnimationFrame(()=>{el.style.transition="";el.style.transform=""})}}
    if(k===selBook)el.classList.add("sel");
    el.onclick=()=>{
      if(!selBook){selBook=k;el.classList.add("sel");AU.sfx("pick");return}
      if(selBook===k){selBook=null;el.classList.remove("sel");return}
      const a=st().order.indexOf(selBook),b=st().order.indexOf(k);[st().order[a],st().order[b]]=[st().order[b],st().order[a]];selBook=null;save();AU.sfx("book");
      paintSpines();$("#spBooks").innerHTML=specialBooks();
    };
  });
}

function frond(x,y,len,ang,cls="f-leaf",wid=.16){
  // a palm leaf: central rib plus a fringe of leaflets, drawn as one path
  const a=ang*Math.PI/180,ca=Math.cos(a),sa=Math.sin(a);const P=(u,v)=>`${(x+u*ca-v*sa).toFixed(1)} ${(y+u*sa+v*ca).toFixed(1)}`;
  let d=`M${P(0,0)}`;const n=9;
  for(let i=1;i<=n;i++){const u=len*i/n,w=len*wid*Math.sin(Math.PI*i/(n+1));d+=` L${P(u-len*.05,-w)} L${P(u,-w*.15)}`}
  for(let i=n;i>=1;i--){const u=len*i/n,w=len*wid*Math.sin(Math.PI*i/(n+1));d+=` L${P(u,w*.15)} L${P(u-len*.05,w)}`}
  return `<path class="${cls}" d="${d} Z"/><path d="M${P(0,0)} L${P(len,0)}" stroke="#000" stroke-opacity=".3" stroke-width="2.5"/>`;
}

function conservFX(t,dt,c){
  const centre=camX+viewW/2-1000+mouseP;
  glow(1500+centre*.12,250,240,[220,230,255],.16);
  const flick=.9+.06*Math.sin(t*8)+.04*Math.sin(t*17);
  [[760,328],[1420,328]].forEach(([x,y],i)=>{glow(x,y,420*flick,c.lamp,.15);glow(x,y,60,c.fire2,.5);const h=12+3*Math.sin(t*9+i*2);
    const g=cx.createLinearGradient(0,y+8,0,y-h);g.addColorStop(0,rgba(c.fire2,.95));g.addColorStop(1,rgba(c.fire,0));cx.fillStyle=g;cx.beginPath();cx.moveTo(x-4,y+8);cx.quadraticCurveTo(x-5,y,x+Math.sin(t*6+i),y-h);cx.quadraticCurveTo(x+5,y,x+4,y+8);cx.fill()});
  // rain on the glass walls
  cx.save();cx.beginPath();cx.rect(-600,46,3200,708);cx.clip();
  cx.strokeStyle=`rgba(190,215,235,${S.world==="neon"?.24:.17})`;cx.lineWidth=1.3;cx.beginPath();
  for(const d of P.rain){d.y+=d.v*dt;d.x-=d.v*dt*.12;if(d.y>760){d.y=40;d.x=camX-60+Math.random()*(viewW+120)}cx.moveTo(d.x,d.y);cx.lineTo(d.x+d.l*.12,d.y-d.l)}cx.stroke();
  for(const d of P.drops){d.y+=d.v*dt*(Math.random()<.02?6:1);if(d.y>750){d.y=50;d.x=Math.random()*2000}cx.fillStyle="rgba(200,225,245,.18)";cx.beginPath();cx.arc(d.x,d.y,d.r,0,7);cx.fill()}
  if(P.flash>0){cx.fillStyle=`rgba(220,230,255,${P.flash*.55})`;cx.fillRect(camX,46,viewW,708);
    if(P.bolt&&P.flash>.45){cx.strokeStyle=`rgba(255,255,255,${P.flash})`;cx.lineWidth=3;cx.beginPath();P.bolt.forEach((p,i)=>i?cx.lineTo(p[0],p[1]):cx.moveTo(p[0],p[1]));cx.stroke()}}
  cx.restore();
  // fountain: falling sheets of water and ripples
  cx.save();cx.setLineDash([10,14]);cx.lineDashOffset=-t*140;cx.lineWidth=2;
  for(let k=0;k<10;k++){const x=934+k*14.6,dx=(x-1000)*.3;cx.strokeStyle=`rgba(200,225,245,${.22+.1*Math.sin(t*3+k)})`;cx.beginPath();cx.moveTo(x,648);cx.quadraticCurveTo(x+dx*.6,690,x+dx,798);cx.stroke()}
  cx.setLineDash([]);cx.restore();
  P.ripples=P.ripples.map(p=>(p+dt*.35)%1);
  for(const p of P.ripples){cx.strokeStyle=`rgba(200,225,245,${(1-p)*.3})`;cx.lineWidth=1.5;cx.beginPath();cx.ellipse(1000,804,40+p*110,6+p*18,0,0,7);cx.stroke()}
  glow(1000,800,220,c.win,.06);
}

function musicFX(t,dt,c){
  const flick=.9+.05*Math.sin(t*7.7)+.05*Math.sin(t*15.3);
  glow(1000,180,620*flick,c.lamp,.15);
  [[920,116],[960,116],[1000,132],[1040,116],[1080,116]].forEach(([x,y],i)=>{const h=11+2*Math.sin(t*9+i*2);glow(x,y-4,54,c.fire,.25);
    const g=cx.createLinearGradient(0,y+3,0,y-h);g.addColorStop(0,rgba(c.fire2,.95));g.addColorStop(1,rgba(c.fire,0));cx.fillStyle=g;cx.beginPath();cx.moveTo(x-3.5,y+3);cx.quadraticCurveTo(x-4,y-h*.4,x+Math.sin(t*5+i),y-h);cx.quadraticCurveTo(x+4,y-h*.4,x+3.5,y+3);cx.fill()});
  // moonbeam across the floor
  const g=cx.createLinearGradient(1500,300,1300,1000);g.addColorStop(0,rgba(c.win,.12));g.addColorStop(1,rgba(c.win,0));
  cx.fillStyle=g;cx.beginPath();cx.moveTo(1385,625);cx.lineTo(1615,625);cx.lineTo(1500,1000);cx.lineTo(1120,1000);cx.closePath();cx.fill();
  glow(1500,250,170,[230,235,255],.18);
  for(const m of P.motes){m.x+=m.vx*dt;m.y+=m.vy*dt+Math.sin(t+m.p)*.08;if(m.x<1120||m.x>1600)m.vx*=-1;if(m.y<620||m.y>1000)m.vy*=-1;const a=.25+.35*Math.sin(t*1.5+m.p);if(a>0){cx.fillStyle=rgba(c.win,a);cx.fillRect(m.x,m.y,2.2,2.2)}}
  if(P.flash>0){cx.fillStyle=`rgba(220,230,255,${P.flash*.6})`;cx.fillRect(1385,165,230,460)}
  // gramophone notes
  if(P.gramo>0){P.gramo-=dt;if(Math.random()<dt*2.2)P.notes.push({x:1640,y:430,vx:-10-Math.random()*20,vy:-30-Math.random()*20,l:3})}
  P.notes=P.notes.filter(n=>(n.l-=dt)>0);
  cx.font="28px serif";for(const n of P.notes){n.x+=n.vx*dt+Math.sin(t*3+n.y)*.3;n.y+=n.vy*dt;cx.fillStyle=rgba(c.fire2,Math.min(1,n.l)*.8);cx.fillText("♪",n.x,n.y)}

}

function obsFX(t,dt,c){
  glow(200,600,380,c.fire,.16);glow(200,596,40,c.fire2,.5);flame(200,596,12+2*Math.sin(t*9),c,t,0);
  const centre=camX+viewW/2-1000+mouseP;
  cx.save();cx.beginPath();cx.arc(1000,330,190,0,7);cx.clip();for(let i=0;i<14;i++){const x=840+(i*97)%330+centre*.12,y=170+(i*61)%260,a=.5+.5*Math.sin(t*(1.5+i%4)+i);glow(x,y,6,[255,255,255],a*.7)}cx.restore();
  glow(1080+centre*.12,260,120,[230,235,255],.2);
  const g=cx.createLinearGradient(1000,330,1000,900);g.addColorStop(0,rgba(c.win,.1));g.addColorStop(1,rgba(c.win,0));cx.fillStyle=g;cx.beginPath();cx.moveTo(880,480);cx.lineTo(1120,480);cx.lineTo(1250,900);cx.lineTo(750,900);cx.closePath();cx.fill();
  for(const m of P.motes){m.x+=m.vx*dt;m.y+=m.vy*dt+Math.sin(t+m.p)*.08;if(m.x<780||m.x>1220)m.vx*=-1;if(m.y<480||m.y>900)m.vy*=-1;cx.fillStyle=rgba(c.win,.25+.3*Math.sin(t*1.4+m.p));cx.fillRect(m.x,m.y,2.2,2.2)}
  [[80,22,.6],[50,14,1.1]].forEach(([rx,ry,sp],i)=>{const a=t*sp+i*2;glow(1380+Math.cos(a)*rx,620+Math.sin(a)*ry,10,i?[140,190,255]:[255,170,120],.8)});
}

function pigGlyph(ch,s=30,col="#1a120c",w=3){
  const n=ch.charCodeAt(0)-65;let d="",dot=false;
  if(n<18){const k=n%9;dot=n>=9;const r=Math.floor(k/3),c=k%3;if(r>0)d+=`M0 0H${s}`;if(r<2)d+=`M0 ${s}H${s}`;if(c>0)d+=`M0 0V${s}`;if(c<2)d+=`M${s} 0V${s}`}
  else{const k=(n-18)%4;dot=n>=22;const m=s/2;d=[`M0 ${s*.12}L${m} ${s*.85}L${s} ${s*.12}`,`M${s*.12} 0L${s*.85} ${m}L${s*.12} ${s}`,`M${s*.88} 0L${s*.15} ${m}L${s*.88} ${s}`,`M0 ${s*.88}L${m} ${s*.15}L${s} ${s*.88}`][k]}
  return `<path d="${d}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>${dot?`<circle cx="${s/2}" cy="${s/2}" r="${w*1.1}" fill="${col}"/>`:""}`}

    for(let k=0;k<9;k++){const r=Math.floor(k/3),c=k%3,x=ox+c*40+20,y=oy+r*40+20;s+=`<text x="${x-(dots?7:0)}" y="${y+7}" text-anchor="middle" font-family="Cormorant Garamond,serif" font-weight="700" font-size="20" fill="#2d4a3a">${String.fromCharCode(start+k)}</text>${dots?`<circle cx="${x+9}" cy="${y}" r="3.4" fill="#7a1f2a"/>`:""}`}return s};

  return `<svg viewBox="0 0 340 360" role="img" aria-label="Embroidered sampler. Two noughts-and-crosses grids: A to I, then J to R with a dot in each cell. Two X shapes: S top, T left, U right, V bottom, then W X Y Z the same way with dots."><rect width="340" height="360" rx="14" fill="#efe6d2"/><rect x="10" y="10" width="320" height="340" rx="10" fill="none" stroke="#c9a24a" stroke-width="3" stroke-dasharray="2 4"/>

let last=performance.now(),hubOn=false;
function frame(now){

  else if(mouseP){applyCam()}
  if(!titleOn&&!hubOn){
    const k=scale*dpr,c=pal();
    cx.setTransform(1,0,0,1,0,0);cx.clearRect(0,0,cv.width,cv.height);
    cx.setTransform(k,0,0,k,-camX*k,-camY*k);cx.globalCompositeOperation="lighter";
    R.fx(t,dt,c);
    if(P.flash>0){cx.fillStyle=`rgba(190,205,255,${P.flash*.22})`;cx.fillRect(camX,camY,viewW,viewH);P.flash=Math.max(0,P.flash-dt*2.4)}
    P.next-=dt;if(P.next<=0){strike();P.next=R.storm[0]+Math.random()*R.storm[1]}
    if(P.hint>0){P.hint-=dt;const a=Math.min(1,P.hint)*.9;cx.lineWidth=4.5/scale;
      R.searchable.filter(id=>!E().seen[id]).forEach((id,i)=>{const b=HOTBOX[id];if(!b)return;const r=Math.min(b.width,b.height)*.35+10*Math.sin(t*4+i);
        cx.strokeStyle=`rgba(255,215,130,${a})`;cx.beginPath();cx.arc(b.x+b.width/2,b.y+b.height/2,Math.max(26,r),0,7);cx.stroke();glow(b.x+b.width/2,b.y+b.height/2,Math.max(40,r*1.2),[255,200,110],a*.25)})}
    cx.globalCompositeOperation="source-over";
    const dr=$("#darkRect");if(dr)dr.setAttribute("opacity",(.5-P.flash*.3).toFixed(3));
  }
  if(titleOn||hubOn)drawTitle(dt);
  requestAnimationFrame(frame);
}

 const pv=$("#avHubPv");if(pv)pv.onclick=()=>openFromGame("outfit");
 document.querySelectorAll("[data-crew]").forEach(b=>b.onclick=()=>crewCard(+b.dataset.crew))}
function openFromGame(t,first){AU.init();AU.resume();AU.sfx("open");open({tab:t,first:!!first,onDone:()=>{if(typeof hubOn!=="undefined"&&hubOn)showHub()}})}
function crewCard(i){const c=CREW[i],cfg=Object.assign({},A.DEFAULT,c[2]);const leg=Object.keys(SEC).filter(k=>SEC[k].items&&priceOf(k,cfg[SEC[k].key]).r==="l").map(k=>itemName(k,cfg[SEC[k].key]));
 openSheet(`${c[0]}'s detective`,`<div class="avsheet-card">${cardHTML(cfg,{name:c[0],title:c[1]==="Neon Noir"?"Night Owl":"Private Eye"})}</div>
  <p class="small" style="margin:12px 2px">Playing in ${c[1]}.${leg.length?` Wearing Legendary: ${leg.join(", ")}.`:""}</p><button class="btn pri block" id="crewTry">Try this look on</button>`,"Crew · week "+S.week);
 $("#crewTry").onclick=()=>{closeSheet();setTimeout(()=>{open({tab:"outfit",onDone:()=>{if(hubOn)showHub()}});Object.assign(draft,c[2]);paintAll();toast(`Trying on ${c[0]}'s look.`)},380)}}
function profileSheet(){const s=st();AU.init();AU.resume();AU.sfx("paper");
 openSheet(s.name||"Your detective",`<div class="avsheet-card">${cardHTML(s.cfg)}</div><div class="avhub-stats" style="justify-content:center;margin:12px 0"><span>${COIN}${S.coins} coins</span><span>${Object.keys(s.owned).length} unlocked</span></div>
  <button class="btn pri block" id="pfEdit">Open the wardrobe</button><p class="small" style="margin-top:10px">Your look never changes a clue. It's how your crew sees you.</p>`,"Profile");
 $("#pfEdit").onclick=()=>{closeSheet();setTimeout(()=>open({tab:"outfit",onDone:()=>paintDock()}),380)}}
function endBlock(){const s=st();if(!s.made)return"";return`<div class="avend"><div class="avend-pv">${cardHTML(s.cfg,{noRank:1})}</div><div><b>${esc(s.name||"Your detective")}</b><span>sealed week ${R.week}. Coins buy looks, never clues.</span><button class="btn" id="avEndW">Spend coins in the wardrobe</button></div></div>`}
function bindEnd(){const b=$("#avEndW");if(b)b.onclick=()=>open({tab:"outfit",onDone:()=>{const e=document.querySelector(".avend-pv");if(e)e.innerHTML=cardHTML(st().cfg,{noRank:1})}})}

return{open,paintDock,hubCard,bindHub,profileSheet,endBlock,bindEnd,st,cardHTML,LOOKS,BUNDLES};
})();

/* =====================================================================
   BOOT
   ===================================================================== */
S.week=Math.max(S.week||1,6);save(); // preview: weeks 2 to 6 back-dated so testers can play all six
document.body.dataset.world=S.world;paintSnd();loadRoom("study");
$("#startBtn").onclick=()=>{
  AU.init();AU.resume();AU.sfx("open");
  const t=$("#title");t.classList.add("fade");
  setTimeout(()=>{t.hidden=true;titleOn=false;showHub();if(!AVX.st().made)AVX.open({first:true,tab:"looks",onDone:()=>showHub()})},800);
};
$("#avDock").onclick=()=>AVX.profileSheet();AVX.paintDock();
requestAnimationFrame(frame);

</script>
