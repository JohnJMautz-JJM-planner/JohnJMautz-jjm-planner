<!doctype html>
<html lang="en" data-world="starlight">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vault Explorers</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!-- The Vault: Explorers - Phase B prototype, adventure 1 "The Missing Beacon".
     Self-contained: no network requests, no accounts, no links, no purchases, no tracking.
     Progress is saved only in this browser (localStorage). -->
<style>
/* Layout: one centered column (max 720px) - top bar, guide bubble, then a light puzzle board.
   Worlds only re-skin the frame (background, accents). Puzzle boards use one fixed palette in every world. */
:root{
  --font: ui-rounded, "SF Pro Rounded", "Nunito", "Varela Round", "Trebuchet MS", system-ui, -apple-system, "Segoe UI", sans-serif;
  --board:#fffdf7; --board-ink:#2b2547; --board-muted:#6d6690; --board-line:#e9e2d2;
  --good:#2fae66; --oops:#e8544e;
  --bg1:#1b1846; --bg2:#3a2a86; --onbg:#fff7e0; --panel:#fffaf0; --ink:#2a2346;
  --accent:#ffc23d; --accent-ink:#3a2500; --accent2:#ff7aa8; --deco:"✨ 🌙 ⭐";
  color-scheme: light;
}
html[data-world="starlight"]{--bg1:#1b1846;--bg2:#3d2c8c;--onbg:#fff7e0;--panel:#fffaf0;--ink:#2a2346;--accent:#ffc23d;--accent-ink:#3a2500;--accent2:#ff7aa8;
  --pattern: radial-gradient(circle at 20% 30%, rgba(255,255,255,.9) 1px, transparent 2px) 0 0/90px 90px, radial-gradient(circle at 70% 80%, rgba(255,230,160,.7) 1px, transparent 2px) 0 0/130px 130px;}
html[data-world="jungle"]{--bg1:#0d4d34;--bg2:#1f8a55;--onbg:#fffbe6;--panel:#fffdf2;--ink:#1d3324;--accent:#ffb703;--accent-ink:#3b2600;--accent2:#fb7a3c;
  --pattern: radial-gradient(ellipse 18px 8px at 30% 40%, rgba(150,230,140,.18) 90%, transparent) 0 0/80px 70px, radial-gradient(ellipse 8px 16px at 70% 70%, rgba(255,240,150,.12) 90%, transparent) 0 0/110px 90px;}
html[data-world="reef"]{--bg1:#0a5d7a;--bg2:#17a3b4;--onbg:#f2fffd;--panel:#f4fffd;--ink:#10343d;--accent:#ff8a73;--accent-ink:#3d1208;--accent2:#ffd166;
  --pattern: radial-gradient(circle at 30% 30%, rgba(255,255,255,.22) 4px, transparent 5px) 0 0/70px 90px, radial-gradient(circle at 75% 65%, rgba(255,255,255,.15) 7px, transparent 8px) 0 0/120px 140px;}
html[data-world="clouds"]{--bg1:#9fc2ff;--bg2:#ffd3ee;--onbg:#33275a;--panel:#ffffff;--ink:#3b2d5c;--accent:#8a5cf6;--accent-ink:#ffffff;--accent2:#ff8fab;
  --pattern: radial-gradient(ellipse 40px 16px at 30% 40%, rgba(255,255,255,.55) 90%, transparent) 0 0/170px 120px, radial-gradient(ellipse 28px 12px at 80% 80%, rgba(255,255,255,.45) 90%, transparent) 0 0/220px 160px;}

html{font-size:17px;min-height:100%;-webkit-text-size-adjust:100%;background:var(--bg1);background:var(--pattern), linear-gradient(165deg,var(--bg1),var(--bg2))}
html.big{font-size:20px}
html.easy body{letter-spacing:.05em;word-spacing:.14em}
html.easy p, html.easy .bubble p{line-height:1.75}
body{margin:0;min-height:100vh;font-family:var(--font);color:var(--ink);background:transparent;
  -webkit-tap-highlight-color:transparent;overscroll-behavior:none}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--accent2);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.15}
p{margin:0;line-height:1.5}
#app{max-width:720px;margin:0 auto;padding-block:10px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:14px}

/* top bar */
.top{display:flex;align-items:center;gap:8px}
.top .ttl{flex:1;min-width:0;color:var(--onbg);font-weight:900;font-size:1.05rem;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ib{width:46px;height:46px;border-radius:50%;border:0;background:var(--panel);display:grid;place-items:center;font-size:1.3rem;box-shadow:0 3px 0 rgba(0,0,0,.18);flex:none}
.ib:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.18)}
.sparks{display:flex;align-items:center;gap:6px;height:46px;padding:0 14px;border-radius:23px;background:var(--panel);font-weight:900;box-shadow:0 3px 0 rgba(0,0,0,.18);border:0;font-variant-numeric:tabular-nums;flex:none}
.sparks b{color:#e29a00;font-size:1.15rem}
.sparks.pop{animation:pop .6s}
@keyframes pop{40%{transform:scale(1.18)}}

/* guide */
.guide{display:flex;align-items:flex-end;gap:8px}
.pip{width:70px;flex:none;filter:drop-shadow(0 4px 0 rgba(0,0,0,.15))}
.pip svg{width:100%;height:auto;display:block}
.pip .eyes{animation:blink 5s infinite;transform-origin:40px 44px}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.bubble{position:relative;flex:1;min-width:0;background:var(--panel);border-radius:20px;padding:12px 14px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.bubble::before{content:"";position:absolute;left:-9px;bottom:16px;border:10px solid transparent;border-right-color:var(--panel);border-left:0}
.bubble p{font-size:1.02rem;font-weight:600}
.brow{display:flex;gap:8px;justify-content:flex-end;margin-top:8px}
.brow:empty{display:none}
.mini{border:0;border-radius:14px;padding:8px 14px;min-height:40px;font-weight:800;background:#efe9fb;color:#3b2d5c}
.mini.go{background:var(--accent);color:var(--accent-ink)}

/* boards & buttons */
.board{background:var(--board);color:var(--board-ink);border-radius:24px;padding:16px;box-shadow:0 4px 0 rgba(0,0,0,.16);display:flex;flex-direction:column;gap:14px}
.board h2{font-size:1.25rem}
.board .sub{color:var(--board-muted);font-weight:600;font-size:.92rem}
.btn{border:0;border-radius:18px;min-height:54px;padding:12px 20px;font-weight:900;font-size:1.05rem;background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 rgba(0,0,0,.22)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.btn.alt{background:#efe9fb;color:#3b2d5c}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.hintbar{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.hintbtn{border:0;border-radius:16px;min-height:48px;padding:8px 16px;font-weight:900;background:#fff3c4;color:#5a4300;box-shadow:0 3px 0 #e7cf7a}
.hintbox{display:flex;gap:10px;align-items:flex-start;background:#fff3c4;border:2px solid #f0d36e;border-radius:16px;padding:12px 14px;font-weight:700;color:#4a3800;animation:rise .25s ease-out}
.hintbox span{font-size:1.3rem;line-height:1.2}
.free{font-size:.82rem;color:var(--board-muted);font-weight:700}
.note{font-size:.8rem;color:var(--board-muted)}
.msg{border-radius:16px;padding:10px 14px;font-weight:700;background:#f1edff;color:#3b2d5c}
.msg.good{background:#dcf7e6;color:#155c33}
.msg.oops{background:#ffe6e2;color:#7d211c}

/* hub */
.beacon-card{background:var(--panel);border-radius:24px;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.16)}
.beacon-card svg{display:block;width:100%;height:auto}
.stops{display:flex;flex-direction:column;gap:0}
.stop{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;background:var(--panel);border-radius:22px;padding:12px 14px;box-shadow:0 4px 0 rgba(0,0,0,.16);min-height:84px}
.stop:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.16)}
.stop .ic{width:60px;height:60px;border-radius:18px;background:#f3eefe;display:grid;place-items:center;flex:none}
.stop .ic svg{width:48px;height:48px}
.stop .tx{flex:1;min-width:0}
.stop .tx h3{font-size:1.1rem}
.stop .tx p{font-size:.88rem;color:#6d6690;font-weight:600}
.stop .st{font-size:1.5rem;flex:none}
.stop.locked{opacity:.6}
.stop.done .ic{background:#dcf7e6}
.link{width:6px;height:16px;margin-left:42px;background:repeating-linear-gradient(var(--onbg) 0 4px,transparent 4px 8px);opacity:.7}
.worldtag{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:20px;padding:8px 14px;min-height:44px;background:rgba(255,255,255,.18);color:var(--onbg);font-weight:800}
html[data-world="clouds"] .worldtag{background:rgba(255,255,255,.6)}

/* observatory */
.sunbar{display:flex;align-items:center;gap:8px;font-weight:800;font-size:.85rem;color:var(--board-muted)}
.sunbar .sun{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 40% 40%,#fff4b0,#ffb300 60%,#ff7a00);box-shadow:0 0 14px #ffc94d;flex:none}
.sunbar .arrow{flex:1;height:4px;border-radius:2px;background:linear-gradient(90deg,#ffb300,#c9c2e6)}
.orbits{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;background:#1d1a45;border-radius:18px;padding:10px;position:relative}
.belt{grid-column:1/-1;text-align:center;font-size:.72rem;font-weight:800;color:#b9b2e8;letter-spacing:.06em;text-transform:uppercase;
  background:radial-gradient(circle,#8d86b8 1px,transparent 1.6px) 0 0/9px 7px;padding:2px 0;border-radius:6px}
.oslot{aspect-ratio:1/1.05;border-radius:14px;border:2px dashed #5d579a;background:rgba(255,255,255,.04);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:#cfc9f5;padding:4px;min-height:64px}
.oslot .n{font-size:.72rem;font-weight:900;opacity:.85}
.oslot svg{width:44px;height:44px;flex:none}
.oslot .pn{font-size:.68rem;font-weight:800;color:#fff}
.oslot.lock{border:2px solid #ffd76a;background:rgba(255,215,106,.14);box-shadow:0 0 14px rgba(255,215,106,.45)}
.oslot.target{border-color:#ffd76a;background:rgba(255,215,106,.08)}
.tray{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.pchip{border:3px solid transparent;background:#f3eefe;border-radius:16px;padding:6px 2px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:76px;font-weight:800;font-size:.78rem;color:#3b2d5c}
.pchip svg{width:48px;height:48px}
.pchip.sel{border-color:var(--accent2);background:#fff0f5;transform:translateY(-3px)}
.pchip.gone{visibility:hidden}
.wiggle{animation:wiggle .5s 2}
@keyframes wiggle{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.comet{flex:none;border:0;background:transparent;font-size:1.3rem;width:44px;height:44px;padding:0;animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translate(-4px,4px)}}

/* bridge */
.lab{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.labbtn{border:0;background:#f3eefe;border-radius:18px;padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;color:#3b2d5c;min-height:120px}
.labbtn svg{width:70px;height:70px;overflow:visible}
.labbtn .shape{transform-box:fill-box;transform-origin:50% 100%;transition:transform .5s cubic-bezier(.3,1.6,.5,1)}
.labbtn.pushed .sq{transform:skewX(28deg) scaleY(.88)}
.labbtn.pushed .tri{animation:hold .5s}
@keyframes hold{30%{transform:translateX(3px)}60%{transform:translateX(-2px)}}
.labres{font-size:.8rem;font-weight:700;color:#6d6690;text-align:center;min-height:2.4em}
.bridge-wrap{background:linear-gradient(#cdeeff,#eaf8ff);border-radius:18px;overflow:hidden}
.bridge-svg{display:block;width:100%;height:auto}
.bridge-wrap{position:relative}
.btap{position:absolute;border:0;padding:0;margin:0;background:transparent;border-radius:10px;cursor:pointer;-webkit-appearance:none;appearance:none}
.btap:active{background:rgba(125,107,214,.18)}
.bridge-svg .squish{transform-box:fill-box;transform-origin:50% 100%;animation:squish .6s forwards}
@keyframes squish{to{transform:skewX(30deg) scaleY(.6)}}
.bridge-svg .rollaway{animation:roll 1s forwards}
@keyframes roll{to{transform:translate(40px,60px)}}
.shapes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.schip{border:3px solid transparent;background:#f3eefe;border-radius:16px;min-height:70px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-weight:900;color:#3b2d5c;font-size:.8rem}
.schip svg{width:34px;height:34px}
.schip.sel{border-color:var(--accent2);background:#fff0f5;transform:translateY(-3px)}
.schip[disabled]{opacity:.35}

/* trail */
.prints{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.print{border:3px solid transparent;background:#f5efe2;border-radius:18px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:120px;font-weight:800;color:#5a4a33;font-size:.8rem}
.print svg{width:64px;height:64px}
.print.no{background:#ffe9e4}
.print.yes{border-color:var(--good);background:#dcf7e6}
.map{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;background:#6fb85a;padding:6px;border-radius:18px}
.tile{aspect-ratio:1;border-radius:10px;background:#9bd67e;position:relative;display:grid;place-items:center;font-size:1.25rem;overflow:hidden}
.tile.forest{background:#4f9a4a}
.tile.water{background:#64c3ec}
.tile.meadow{background:#b9e07e}
.tile .deco{opacity:.95}
.tile .tp{position:absolute;inset:14%;display:grid;place-items:center}
.tile .tp svg{width:100%;height:100%}
.tile.seen .tp{opacity:.35}
.tile.here{box-shadow:inset 0 0 0 4px #ffd23f}
.tile .me{position:absolute;right:3px;bottom:3px;width:38%;height:38%;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 0 rgba(0,0,0,.25)}
.tile .secretbtn{position:absolute;left:0;top:0;width:100%;height:100%;border:0;background:transparent;font-size:1.1rem;padding:0;display:flex;align-items:flex-end;justify-content:flex-start;padding:4px}
.compass{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(3,64px);gap:6px;justify-content:center}
.cbtn{border:0;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-weight:900;font-size:1.3rem;box-shadow:0 4px 0 rgba(0,0,0,.22)}
.cbtn small{display:block;font-size:.6rem;font-weight:800;opacity:.85}
.cbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.crose{display:grid;place-items:center;font-size:1.6rem;color:#8b83b8}

/* vault */
.vault{background:radial-gradient(circle at 50% 35%,#4b4380,#231f4a);border-radius:22px;padding:18px 12px;display:flex;flex-direction:column;align-items:center;gap:14px;color:#efeaff}
.engrave{font-weight:800;text-align:center;font-size:1rem;color:#ffe9a8;letter-spacing:.02em;max-width:30ch}
.dials{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:420px}
.dial{aspect-ratio:1;border-radius:50%;border:5px solid #ffd76a;background:radial-gradient(circle,#3a336d,#1a1638);display:grid;place-items:center;box-shadow:0 0 0 4px #2a2552, 0 6px 0 rgba(0,0,0,.35)}
.dial svg{width:62%;height:62%}
.dial.spin{animation:spin .3s}
@keyframes spin{from{transform:rotate(-40deg)}}
.dlabel{text-align:center;font-size:.75rem;font-weight:800;color:#c9c2f0;margin-top:4px}
.mysyms{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.symcard{background:#f3eefe;border-radius:16px;padding:8px;text-align:center;font-weight:800;color:#3b2d5c;font-size:.78rem}
.symcard svg{width:44px;height:44px}
.symcard .num{display:inline-block;margin-top:2px;background:#ffd76a;color:#3a2500;border-radius:10px;padding:1px 9px;font-size:1rem;font-variant-numeric:tabular-nums}
.symcard.empty{opacity:.45}

/* room */
.room{position:relative;aspect-ratio:4/3;border-radius:22px;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.16)}
.room .wall{position:absolute;inset:0 0 34% 0}
.room .floor{position:absolute;inset:66% 0 0 0;box-shadow:inset 0 10px 14px rgba(0,0,0,.15)}
.room .win{position:absolute;left:6%;top:9%;width:26%;aspect-ratio:1;border-radius:14px 14px 4px 4px;border:6px solid #fff;background:var(--bg1);background:var(--pattern),linear-gradient(165deg,var(--bg1),var(--bg2));box-shadow:0 3px 0 rgba(0,0,0,.15)}
.room .win::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:5px;margin-left:-2.5px;background:#fff}
.room .art{position:absolute;left:41%;top:10%;width:22%;aspect-ratio:1/1.1;border:5px solid #8a5a3c;background:#fff8ec;display:grid;place-items:center;font-size:clamp(1.4rem,7vw,2.8rem)}
.room .art.empty{border-style:dashed;border-color:rgba(0,0,0,.2);background:transparent}
.room .shelf{position:absolute;right:6%;top:38%;width:24%;height:4%;background:#8a5a3c;border-radius:3px}
.room .shelf span{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);font-size:clamp(1.4rem,7vw,2.8rem);line-height:1}
.room .corner{position:absolute;left:5%;bottom:10%;font-size:clamp(2rem,11vw,4.4rem);line-height:1}
.room .ava{position:absolute;left:50%;bottom:6%;width:24%;transform:translateX(-50%)}
.room .ava svg{width:100%;height:auto;display:block}
.room .pet{position:absolute;left:68%;bottom:8%;font-size:clamp(1.6rem,8vw,3.2rem);line-height:1}
.room .rname{position:absolute;left:10px;bottom:8px;background:rgba(255,255,255,.85);border-radius:12px;padding:4px 10px;font-weight:900;font-size:.8rem;color:#3b2d5c}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;border-radius:14px;padding:8px 12px;min-height:44px;font-weight:800;background:#f3eefe;color:#3b2d5c;white-space:nowrap;flex:none}
.tab.on{background:var(--accent);color:var(--accent-ink)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.item{border:3px solid transparent;background:#f6f2ff;border-radius:16px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;min-height:112px;font-weight:800;color:#3b2d5c;font-size:.78rem;text-align:center}
.item .pv{width:52px;height:40px;border-radius:10px;display:grid;place-items:center;font-size:1.8rem}
.item .cost{font-size:.75rem;color:#8a6a00}
.item.using{border-color:var(--good);background:#e6f9ee}
.item.cant{opacity:.55}
.swatch{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 2px #d8d0ef}

/* modal */
#modal{position:fixed;inset:0;z-index:50;background:rgba(20,16,50,.55);display:flex;align-items:flex-end;justify-content:center;
  padding:12px max(12px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
@media (min-width:600px){#modal{align-items:center}}
.sheet{background:var(--board);color:var(--board-ink);width:100%;max-width:520px;max-height:88vh;overflow:auto;border-radius:26px;padding:20px;display:flex;flex-direction:column;gap:14px;box-shadow:0 10px 40px rgba(0,0,0,.35);animation:rise .25s ease-out}
@keyframes rise{from{transform:translateY(30px);opacity:.4}}
.sheet h2{font-size:1.35rem}
.reward{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.reward .big{width:120px;height:120px;border-radius:50%;background:radial-gradient(circle,#fff7cf,#ffd76a);display:grid;place-items:center;box-shadow:0 0 30px #ffd76a}
.reward .big svg{width:72px;height:72px}
.reward .plus{font-size:1.4rem;font-weight:900;color:#c98500}
.fact{background:#f1edff;border-radius:16px;padding:12px 14px;font-weight:600;color:#3b2d5c;text-align:left}
.fact b{display:block;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:#7b6fb0;margin-bottom:2px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;border:0;background:#f6f2ff;border-radius:16px;padding:10px 14px;min-height:56px;width:100%;text-align:left;font-weight:800;color:#3b2d5c}
.toggle small{display:block;font-weight:600;color:#6d6690;font-size:.78rem}
.sw{width:52px;height:32px;border-radius:16px;background:#cfc8e6;position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;left:3px;top:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .2s}
.toggle.on .sw{background:var(--good)}
.toggle.on .sw::after{left:23px}
.worlds{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.wcard small{font-weight:700;font-size:.72rem;opacity:.9}
.wcard.on{border-color:#fff;box-shadow:0 0 0 3px var(--accent2)}
.names{display:grid;gap:8px}
.namebtn{border:3px solid transparent;border-radius:16px;background:#f3eefe;min-height:54px;font-weight:900;font-size:1.05rem;color:#3b2d5c}
.namebtn.on{border-color:var(--accent2);background:#fff0f5}
.hold{position:relative;overflow:hidden;border:0;border-radius:16px;min-height:52px;width:100%;font-weight:900;background:#ffe6e2;color:#7d211c}

.hold span{position:relative}
.grown{font-size:.82rem;color:#5d5680;background:#f7f5fb;border-radius:14px;padding:12px;line-height:1.5}

/* finale & confetti */
.beam{animation:beam 2.4s ease-in-out infinite;transform-origin:200px 64px}
@keyframes beam{50%{opacity:.55}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
#fx i{position:absolute;top:-20px;width:10px;height:14px;border-radius:3px;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(720deg)}}
html.calm *{animation:none!important;transition:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

function brEvaluate(){
  for (var i=0;i<6;i++){
    var k=S.br.slots[i];
    if (!k) return {i:i,kind:'empty'};
    if (k==='sq') return {i:i,kind:'square'};
    if (k==='ci') return {i:i,kind:'circle'};
    if (i>0 && S.br.slots[i-1]===k) return {i:i,kind:'gap'};
  }
  return null;
}
function brTest(){
  if (ui.busy) return;

  if (res && res.kind==='empty'){ ui.msg={k:'oops',t:'Fill all six spaces before the test. Space '+(res.i+1)+' is empty.'}; sfx('oops'); render(); return; }
  ui.busy = true; ui.msg = null; ui.brBad=-1; ui.brBadKind=''; render();
  var u=BR.u, L=BR.L, W=L*2+7*u, start=14, end = res ? (L+res.i*u+u*.6) : W-14, cart=document.getElementById('cart'), t0=null, dur=res? 900+res.i*250 : 2400;
  var calm = S.set.calm || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  function step(ts){
    if (!t0) t0=ts; var p=Math.min(1,(ts-t0)/dur), e = p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2, x=start+(end-start)*e;
    if (cart) cart.setAttribute('transform','translate('+x.toFixed(1)+','+(BR.t-10)+')');
    if (p<1 && !calm) requestAnimationFrame(step); else finish();
  }
  function finish(){
    ui.busy = false;
    if (!res){ completeStage('bridge'); return; }
    ui.brBad = res.i; ui.brBadKind = res.kind; ui.anim = true; sfx('oops');
    var t = res.kind==='square' ? 'The square in space '+(res.i+1)+' squashed flat! Squares can lean over when they\'re pushed, like in the Shape Lab.'
      : res.kind==='circle' ? 'The circle in space '+(res.i+1)+' rolled away! Round shapes can\'t hold a road still.'
      : 'Spaces '+res.i+' and '+(res.i+1)+' bump into each other. Two triangles side by side need to take turns: one points up, the next points down.';
    ui.msg = {k:'oops', t:t}; setGuide(['Wobble! Good test. Let\'s fix it and try again.']);

function go(to){

/* ---------- hints ---------- */
function hint(st){
  var n = ++ui.hint[st];
  if (st==='obs'){
    if (n===1) setGuide(['Start with the easy ones: the closest planet and the farthest planet.']);
    else if (n===2) setGuide(['Here\'s a memory trick: "My Very Excited Mother Just Served Us Noodles." Each first letter is a planet, in order!']);
    else { // place one correct planet
      for (var i=0;i<8;i++){ if (!S.obs.lock[i]){ var cur=S.obs.slots[i]; S.obs.slots[i]=PLANETS[i].id; S.obs.lock[i]=1;
        for (var j=0;j<8;j++) if (j!==i && S.obs.slots[j]===PLANETS[i].id && !S.obs.lock[j]) S.obs.slots[j]=null;
        setGuide(['I lit up '+PLANETS[i].name+' for you. It goes in space '+(i+1)+'.']); save();
        if (S.obs.lock.every(function(x){return x;})) { completeStage('obs'); return; }
        break; } }
    }
  } else if (st==='bridge'){
    if (n===1) setGuide(['Which shape stayed strong in the Shape Lab? Use only that shape.']);
    else if (n===2) setGuide(['Triangles fit together when they take turns: point up, then point down. I drew dotted guides for you.']);
    else { var uf=upFirst();
      for (var k=0;k<6;k++){ var want=((k%2===0)===uf)?'up':'down'; if (S.br.slots[k]!==want){ S.br.slots[k]=want; setGuide(['I put a "point '+want+'" triangle in space '+(k+1)+'.']); save(); break; } }
      if (k===6) setGuide(['It looks ready. Tap "Test the bridge"!']);
    }
  } else if (st==='trail'){
    if (!S.tr.found){
      if (n===1) setGuide(['Olive said the tracks have two pointy toes, like a heart split in two.']);
      else if (n===2) setGuide(['Count the toes on each set of tracks. Which one has just two parts?']);
      else setGuide(['It\'s Tracks B, the two-toed hoofprints.']);
    } else {
      if (n===1) setGuide(['Look at the hoofprint on your square. The pointy tips show which way the deer went.']);
      else if (n===2) setGuide(['On the compass, N (north) is up, S (south) is down, E (east) is right and W (west) is left.']);
      else if (S.tr.step<PATH.length) setGuide(['Next, go '+DIRS[PATH[S.tr.step]][3]+'. Tap '+PATH[S.tr.step]+'.']);
    }
  } else if (st==='vault'){
    if (n===1) setGuide(['"Fewest to most" means start with the smallest number and end with the biggest.']);
    else if (n===2) setGuide(['The Hoofprint has 2, the Triangle has 3, and the Star has 8.']);
    else setGuide(['Turn the dials to: Hoofprint, then Triangle, then Star.']);
  }
  ui.hintMsg = ui.lines[0] || null;
  sfx('tap'); render();
  var hb=document.getElementById('hintbox'); if (hb && hb.scrollIntoView) try { hb.scrollIntoView({block:'nearest', behavior:'smooth'}); } catch(e){ hb.scrollIntoView(false); }
}

  'obs-slot': function(d){
    if (locked('obs')) return;
    var i=+d.i; if (S.obs.lock[i]){ setGuide(['That planet is already glowing in the right place!']); render(); return; }
    if (!ui.sel){ if (S.obs.slots[i]){ S.obs.slots[i]=null; save(); sfx('tap'); render(); } else { setGuide(['Tap a planet first, then tap this space.']); render(); } return; }
    S.obs.slots[i]=ui.sel; ui.sel=null; sfx('tap');
    if (S.obs.slots.every(function(x){return x;})) obsCheck();
    save(); if (!S.done.obs || ui.modal) render();
  },
  'lab': function(d){ ui.lab[d.k]=1; sfx('tap'); if (ui.lab.sq&&ui.lab.tri){ addFact('triangle'); save(); } render(); },
  'br-pick': function(d){ if (ui.busy||locked('bridge')) return; ui.sel = ui.sel===d.k ? null : d.k; sfx('tap'); render(); },
  'br-slot': function(d){
    if (ui.busy||locked('bridge')) return; var i=+d.i; ui.brBad=-1; ui.brBadKind=''; ui.msg=null;
    if (ui.sel && S.br.slots[i]===ui.sel){ S.br.slots[i]=null; }
    else if (ui.sel){ if (brLeft(ui.sel)<=0){ ui.msg={k:'',t:'You used up those shapes. Pick another shape, or tap a placed shape to take it back.'}; ui.sel=null; render(); return; } S.br.slots[i]=ui.sel; if (brLeft(ui.sel)<=0) ui.sel=null; }
    else if (S.br.slots[i]) S.br.slots[i]=null;
    else { ui.msg={k:'',t:'First tap a shape below the bridge, then tap a space.'}; }
    save(); sfx('tap'); render();
  },
  'br-clear': function(){ if (ui.busy) return; if (locked('bridge')){ resetStage('bridge'); render(); return; } S.br.slots=[null,null,null,null,null,null]; ui.brBad=-1; ui.msg=null; save(); render(); },
  'br-test': function(){ if (locked('bridge')){ setGuide(['The bridge is already fixed!']); render(); return; } brTest(); },
  'tr-print': function(d){
    if (d.k==='deer'){ S.tr.found=true; addFact('deer'); save(); sfx('good'); ui.msg={k:'good',t:'Yes! Two-toed hoofprints were made by a deer.'}; ui.hint.trail=0; ui.hintMsg=null;
      setGuide(['Yes! A deer made those tracks. Deer walk on two toes on each foot.','Now follow the deer! The pointy tips of each hoofprint show which way it walked. Use the compass.']); render(); return; }
    ui.picked = ui.picked||[]; if (ui.picked.indexOf(d.k)<0) ui.picked.push(d.k); addFact(d.k); save(); sfx('oops');
    ui.msg={k:'oops', t: d.k==='duck' ? 'Those are webbed feet with three toes. A duck made them on its way to the pond. Not our thief!' : 'Four toes and a pad: that\'s a fox. Olive said two pointy toes. Try again!'};
    render();
  },
  'tr-move': function(d){
    if (S.tr.step>=PATH.length) return;
    if (d.d===PATH[S.tr.step]){ S.tr.step++; ui.msg=null; ui.hintMsg=null; sfx('good'); save();
      if (S.tr.step>=PATH.length){ completeStage('trail'); return; }
      setGuide([rnd(['Good tracking!','You found more hoofprints!','That\'s the way!','Keep going!'])+' '+(PATH.length-S.tr.step)+' more to go.']);
    } else { sfx('oops'); ui.msg={k:'oops',t:'No hoofprints to the '+DIRS[d.d][3]+'. Look at which way the pointy tips face.'}; }
    render();
  },
  'dial': function(d){ var i=+d.i; S.vault.dials[i]=(S.vault.dials[i]+1)%DIAL.length; save(); sfx('tap'); render();
    var el=document.querySelectorAll('.dial')[i]; if (el){ el.classList.add('spin'); el.focus({preventScroll:true}); } },
  'vault-try': function(){
    var pick=S.vault.dials.map(function(x){return DIAL[x];});
    if (pick.join()==='hoof,triangle,star'){ ui.msg=null; finishVault(); return; }
    sfx('oops'); ui.msg={k:'oops',t:'The Beacon flickers, but stays dark. Check your Light Symbols: smallest number first.'};
    setGuide(['So close! Look at the numbers on your symbols and try again.']); render();
  },
  'replay-adv': function(){
    S.done={obs:false,bridge:false,trail:false,vault:false}; S.obs={slots:[null,null,null,null,null,null,null,null],lock:[0,0,0,0,0,0,0,0]};
    S.br={slots:[null,null,null,null,null,null]}; S.tr={found:false,step:0}; S.vault={dials:[3,4,5]}; ui.hint={obs:0,bridge:0,trail:0,vault:0}; ui.replay={}; save();
    setGuide(['Let\'s play again! You keep your room and sparks. Sparks are only earned the first time, but any secret finds you missed still count.']); ui.screen='hub'; render();
  },
  'stage-replay': function(d){ resetStage(d.s); render(); window.scrollTo(0,0); },
  'reset-ask': function(){ ui.modal={type:'reset'}; render(); },
  'reset-yes': function(){ store.clear(); S=fresh(); ui.modal=null; ui.replay={}; ui.screen='welcome'; ui.ob=0; ui.hint={obs:0,bridge:0,trail:0,vault:0}; setGuide(INTRO_W); render(); window.scrollTo(0,0); },
  'tab': function(d){ ui.tab=d.t; render(); },
  'item': function(d){
    var c=item(d.id); if (!c) return;
    if (S.owned.indexOf(c.id)>=0){
      var removable = (c.slot==='art'||c.slot==='shelf'||c.slot==='corner') && current(c.slot)===c.id;
      setCurrent(c.slot, removable ? null : c.id); save(); sfx('tap'); render(); return;
    }
    if (c.cost==null) return;
    ui.modal = S.sparks>=c.cost ? {type:'buy', id:c.id} : {type:'need', id:c.id}; render();
  },
  'buy-yes': function(d){
    var c=item(d.id); if (!c || S.sparks<c.cost || S.owned.indexOf(c.id)>=0){ ui.modal=null; render(); return; }
    S.sparks-=c.cost; S.ledger.push({id:'spend.'+c.id, amt:-c.cost, t:Date.now()}); S.owned.push(c.id); setCurrent(c.slot,c.id); save();
    ui.modal=null; sfx('coin'); confetti(); setGuide(['Wow, the '+c.name+' looks great in here!']); render(); bumpSparks();
  }
};

document.addEventListener('click', function(e){
  var el = e.target.closest ? e.target.closest('[data-act]') : null;
  if (!el) { if (e.target.id==='modal' && ui.modal && ui.modal.type!=='reward'){ ui.modal=null; render(); } return; }
  var fn = A[el.getAttribute('data-act')]; if (!fn) return;
  var d = {}; for (var i=0;i<el.attributes.length;i++){ var a=el.attributes[i]; if (a.name.indexOf('data-')===0) d[a.name.slice(5)]=a.value; }
  fn(d);
});

document.addEventListener('keydown', function(e){ if (e.key==='Escape' && ui.modal && ui.modal.type!=='reward'){ ui.modal=null; render(); } });

var INTRO_W = ['Hi there! I\'m Pip, a lantern-bot. I help keep the Beacon on Lantern Hill shining.', 'But last night the Beacon went dark! Its three Light Symbols flew off to hide.', 'Without the Beacon, the night-flyers can\'t find their way home. Will you help me find the symbols?'];
if (ui.screen==='welcome') setGuide(INTRO_W); else setGuide(hubLines());
render();
})();
</script>
</body>
</html>
